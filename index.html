<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SO2 Private Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            font-family: sans-serif;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }
        .instruction {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="instruction">Нажми на карту, чтобы поставить метку для друга</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
   
    <script src="https://unpkg.com/@liveblocks/client@2.14.0/dist/index.browser.js"></script>

    <script>
        // --- 1. НАСТРОЙКА ИГРОВОЙ КАРТЫ ---
        const MAP_IMAGE = 'radar.jpg';
        const IMAGE_WIDTH = 1024;
        const IMAGE_HEIGHT = 1024;

        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2,
            maxZoom: 1,
            zoomControl: true,
            attributionControl: false
        });

        const bounds = [[0, 0], [IMAGE_HEIGHT, IMAGE_WIDTH]];
       
        // Интерактивный фон для кликов
        L.imageOverlay(MAP_IMAGE, bounds, { interactive: true }).addTo(map);
        map.fitBounds(bounds);

        let myMarker = null;
        let friendMarker = null;

        // --- 2. НАСТРОЙКА СЕТИ (LIVEBLOCKS) ---
        const PUBLIC_KEY = "pk_prod_demo";
        const client = Liveblocks.createClient({ publicApiKey: PUBLIC_KEY });
       
        const room = client.enterRoom("my-secret-so2-room-12345", {
            initialPresence: { markerCoords: null }
        });

        // Слушаем метки от друга
        room.subscribe("others", (others) => {
            let hasFriend = false;
            others.forEach(user => {
                if (user.presence?.markerCoords) {
                    const coords = user.presence.markerCoords;
                   
                    if (friendMarker) map.removeLayer(friendMarker);
                   
                    // Рисуем кружок для друга
                    friendMarker = L.circleMarker([coords.lat, coords.lng], {
                        radius: 12,
                        fillColor: '#FF4136',
                        color: '#fff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map).bindPopup('<b>Враг тут!</b>').openPopup();
                       
                    hasFriend = true;
                }
            });
            if (!hasFriend && friendMarker) {
                map.removeLayer(friendMarker);
                friendMarker = null;
            }
        });

        // --- 3. ОБРАБОТКА КЛИКА ПО КАРТЕ ---
        map.on('click', function(e) {
            const coords = { lat: e.latlng.lat, lng: e.latlng.lng };
           
            if (myMarker) map.removeLayer(myMarker);

            // Рисуем твой синий кружок
            myMarker = L.circleMarker([coords.lat, coords.lng], {
                radius: 12,
                fillColor: '#0074D9',
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map).bindPopup('<b>Моя метка</b>').openPopup();
           
            room.updatePresence({ markerCoords: coords });
        });
    </script>
</body>
</html>
