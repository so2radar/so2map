<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SO2 Private Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            font-family: sans-serif;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }
        .instruction {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="instruction" id="status">Подключение к сети...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script>
        // --- 1. НАСТРОЙКА ИГРОВОЙ КАРТЫ (Твоя рабочая база) ---
        const MAP_IMAGE = 'radar.jpg';
        const IMAGE_WIDTH = 1024;
        const IMAGE_HEIGHT = 1024;

        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2,
            maxZoom: 1,
            zoomControl: true,
            attributionControl: false
        });

        const bounds = [[0, 0], [IMAGE_HEIGHT, IMAGE_WIDTH]];
        L.imageOverlay(MAP_IMAGE, bounds, { interactive: true }).addTo(map);
        map.fitBounds(bounds);

        let myMarker = null;
        let friendMarker = null;
        let conn = null;

        // --- 2. НАСТРОЙКА СЕТИ (Прямая связь без блокировок) ---
        const statusText = document.getElementById('status');
       
        // Разделяем окна: если в ссылке есть ?friend, то это Игрок 2
        const isFriend = window.location.search.includes('friend');
        const myID = isFriend ? 'so2-radar-player-2' : 'so2-radar-player-1';
        const friendID = isFriend ? 'so2-radar-player-1' : 'so2-radar-player-2';

        const peer = new Peer(myID, { debug: 1 });

        peer.on('open', () => {
            if (!isFriend) {
                statusText.innerText = "Игрок 1 в сети. Скинь другу ссылку с ?friend на конце";
            } else {
                statusText.innerText = "Подключаемся к Игроку 1...";
                connectToFriend();
            }
        });

        // Слушаем подключение от второго игрока
        peer.on('connection', (connection) => {
            conn = connection;
            statusText.innerText = "Радар синхронизирован! Друг на связи";
            setupDataListener();
        });

        function connectToFriend() {
            conn = peer.connect(friendID);
            conn.on('open', () => {
                statusText.innerText = "Успешно подключено к Игроку 1!";
                setupDataListener();
            });
        }

        // Прием чужих координат (Отображаем красный кружок)
        function setupDataListener() {
            conn.on('data', (data) => {
                if (data && data.lat && data.lng) {
                    if (friendMarker) map.removeLayer(friendMarker);
                    friendMarker = L.circleMarker([data.lat, data.lng], {
                        radius: 12, fillColor: '#FF4136', color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.8
                    }).addTo(map).bindPopup('<b>Враг тут!</b>').openPopup();
                }
            });
        }

        // --- 3. ОБРАБОТКА КЛИКА ПО КАРТЕ ---
        map.on('click', function(e) {
            const coords = { lat: e.latlng.lat, lng: e.latlng.lng };
            if (myMarker) map.removeLayer(myMarker);

            // Твой синий кружок
            myMarker = L.circleMarker([coords.lat, coords.lng], {
                radius: 12, fillColor: '#0074D9', color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.8
            }).addTo(map).bindPopup('<b>Моя метка</b>').openPopup();
           
            // Отправка координат другу напрямую
            if (conn && conn.open) {
                conn.send(coords);
            }
        });
    </script>
</body>
</html>
