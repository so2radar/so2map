<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тактический Радар - Standoff 2</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            font-family: Arial, sans-serif; 
            background-color: #222; 
            color: white; 
        }
        #ui-panel { 
            padding: 10px; 
            background: #333; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            align-items: center; 
            z-index: 1000; 
            position: relative; 
            border-bottom: 2px solid #444;
        }
        #map { 
            height: calc(100% - 60px); /* Место под карту минус высота меню */
            width: 100%; 
            background-color: #111; 
        }
        input, select, button { 
            padding: 6px 10px; 
            font-size: 14px; 
            border-radius: 5px; 
            border: none; 
            outline: none;
        }
        input, select {
            background-color: #444;
            color: white;
        }
        button { 
            background-color: #00ffaa; 
            color: #000; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s;
        }
        button:hover { 
            background-color: #00cc88; 
        }
        .my-label { 
            background: transparent; 
            border: none; 
            color: #fff; 
            font-weight: bold; 
            font-size: 13px; 
            text-shadow: 1px 1px 3px black, -1px -1px 3px black; 
            box-shadow: none; 
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div>Твой ID: <span id="my-id" style="color: #00ffaa; user-select: all; font-family: monospace;">Загрузка...</span></div>
        <input type="text" id="target-id" placeholder="Вставь ID напарника">
        <button id="connect-btn">Подключиться</button>
        <div id="connection-status" style="color: #ffaa00;">Статус: Ожидание...</div>
        
        <select id="map-select">
    <option value="sandstone">Sandstone</option>
    <option value="prison">Prison</option>
    <option value="hanami">Hanami</option>
    <option value="province">Province</option>
    <option value="rust">Rust</option>
    <option value="breeze">Breeze</option>
    <option value="dune">Dune</option>
        </select>
        
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
